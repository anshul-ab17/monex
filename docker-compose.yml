version: "3.9"

services:
    postgres:
        image: postgres:17
        container_name: monex-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: monex
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 5

    redis:
        image: redis:8-alpine
        container_name: monex-redis
        restart: unless-stopped
        command: redis-server --appendonly yes
        ports:
            - "6379:6379"
        volumes:
            - redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5

    redpanda:
        image: docker.redpanda.com/redpandadata/redpanda:v25.1.2
        container_name: monex-redpanda
        restart: unless-stopped
        command:
            - redpanda
            - start
            - --mode=dev-container
            - --smp=1
            - --memory=1G
            - --reserve-memory=0M
            - --node-id=0
            - --check=false
            - --kafka-addr=PLAINTEXT://0.0.0.0:9092
            - --advertise-kafka-addr=PLAINTEXT://localhost:9092
            - --pandaproxy-addr=PLAINTEXT://0.0.0.0:8082
            - --advertise-pandaproxy-addr=PLAINTEXT://localhost:8082
        ports:
            - "9092:9092"   # Kafka API
            - "9644:9644"   # Admin API
            - "8082:8082"   # HTTP Proxy
        volumes:
            - redpanda_data:/var/lib/redpanda/data
        healthcheck:
            test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
            interval: 15s
            timeout: 10s
            retries: 10

volumes:
    postgres_data:
    redis_data:
    redpanda_data: