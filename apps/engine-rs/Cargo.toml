[package]
name = "monex-engine"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "monex-engine"
path = "src/main.rs"

[dependencies]
rust_decimal = { version = "1", features = ["macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
prost = "0.13"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
criterion = "0.5"
rust_decimal_macros = "1"

[[bench]]
name = "orderbook_bench"
harness = false
