version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    container_name: monex
    restart: unless-stopped

    environment:
      POSTGRES_USER: monex
      POSTGRES_PASSWORD: monex
      POSTGRES_DB: monex

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exchange"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: